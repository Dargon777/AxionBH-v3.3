name: AxionBH simulator checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Physics engine tests
        run: node tests/simulator-core.test.cjs
      - name: Static app integrity
        run: node tests/static-app.test.cjs
